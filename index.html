<!doctype html>
<html lang="en">

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abletonaimusiccoach.qd.je" />
    <meta property="og:title" content="Ableton AI Music Coach — Learn Electronic Music Production" />
    <meta property="og:description" content="Learn Ableton Live 12 with an AI music production coach for Psytrance, Goa, Techno and Electronic Music." />
    <meta property="og:image" content="/branding/logo.png" />

    <!-- PWA Manifest & Icons -->

  <body class="bg-[#090d16] text-white">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, sans-serif; background: #090d16; color: #fff;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 12px; color: #10b981;">ABLETON AI MUSIC COACH</div>

      </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
