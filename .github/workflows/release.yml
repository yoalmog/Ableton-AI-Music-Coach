name: Build Ableton AI Music Coach (Web, Windows, Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  release-matrix:
    name: Cross-Platform Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web App
            os: ubuntu-latest
            target: web
          - name: Windows Software (.exe)
            os: windows-latest
            target: windows
          - name: Android APK
            os: ubuntu-latest
            target: android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build Web Application
        if: matrix.target == 'web' || matrix.target == 'android'
        run: npm run build

      - name: Upload Web Dist Artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build Windows Installer & Portable
        if: matrix.target == 'windows'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Release Artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-executables
          path: release/*.exe

      - name: Setup Java JDK (Java 17)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: matrix.target == 'android'
        run: npm run build:apk

      - name: Upload Android APK Artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
