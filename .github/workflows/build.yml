name: Build, Test and Release (Web, Windows, Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Package Lock
        run: npm install --package-lock-only

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-output
          path: dist/

  build-windows:
    name: Build Windows Software (EXE Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Package Lock
        run: npm install --package-lock-only

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable (.exe)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables-release
          path: release/*.exe

  build-android-apk:
    name: Build Android APK / PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Package Lock
        run: npm install --package-lock-only

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Android APK / PWA Release Assets
        run: |
          mkdir -p release-android-apk
          echo "Ableton AI Music Coach Android Mobile App PWA & APK Asset Package" > release-android-apk/README.txt
          cp -r dist/* release-android-apk/

      - name: Upload Android APK Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-bundle-release
          path: release-android-apk/
