<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ableton AI Music Coach - Starting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 640px;
      height: 440px;
      background-color: #0A0A0A;
      color: #E0E0E0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 24px 20px 24px;
      border: 1px solid #333333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 250px;
      background: radial-gradient(circle, rgba(144, 255, 0, 0.08) 0%, rgba(0, 229, 255, 0.05) 50%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      width: 100%;
    }

    .logo-img {
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.8));
      margin-bottom: 8px;
    }

    /* Equalizer Waveform Visualization */
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 36px;
      margin: 12px 0;
      z-index: 1;
    }

    .eq-bar {
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(to top, #90FF00, #00E5FF);
      animation: eqPulse 1.2s infinite ease-in-out alternate;
    }

    .eq-bar:nth-child(1) { height: 30%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 60%; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 90%; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 40%; animation-delay: 0.5s; }
    .eq-bar:nth-child(5) { height: 80%; animation-delay: 0.15s; }
    .eq-bar:nth-child(6) { height: 100%; animation-delay: 0.4s; }
    .eq-bar:nth-child(7) { height: 50%; animation-delay: 0.25s; }
    .eq-bar:nth-child(8) { height: 85%; animation-delay: 0.6s; }
    .eq-bar:nth-child(9) { height: 35%; animation-delay: 0.35s; }
    .eq-bar:nth-child(10) { height: 75%; animation-delay: 0.1s; }

    @keyframes eqPulse {
      0% { transform: scaleY(0.3); opacity: 0.6; }
      100% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 6px #90FF00); }
    }

    /* Status section */
    .status-container {
      width: 100%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-text-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace, monospace;
      font-size: 11px;
      color: #A0A0A0;
      letter-spacing: 0.5px;
    }

    .status-text {
      color: #90FF00;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #90FF00, #00E5FF);
      border-radius: 3px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(144, 255, 0, 0.5);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-family: monospace;
      font-size: 10px;
      color: #555555;
      z-index: 1;
    }

    /* Error / Retry box if needed */
    .error-box {
      display: none;
      background: #1E1010;
      border: 1px solid #FF4444;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #FF8888;
    }
    .error-box button {
      background: #333;
      color: #FFF;
      border: 1px solid #555;
      padding: 4px 12px;
      margin-top: 6px;
      cursor: pointer;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="brand-container">
    <img src="../public/branding/logo.png" alt="Ableton AI Music Coach" class="logo-img" id="logoImg" onError="this.src='branding/logo.png'" />
  </div>

  <div class="eq-container">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <div class="status-container">
    <div class="status-text-row">
      <span class="status-text" id="statusMsg">Initializing Application...</span>
      <span id="percentMsg">15%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="error-box" id="errorBox">
      <div id="errorText">Unable to start Ableton AI Music Coach.</div>
      <button onclick="window.electronSplashAPI?.retry()">Retry</button>
    </div>
  </div>

  <div class="footer-row">
    <span>ABLETON LIVE 12 INTEGRATION</span>
    <span>v1.0.0 (Windows x64)</span>
  </div>

  <script>
    if (window.electronSplashAPI) {
      window.electronSplashAPI.onProgress((data) => {
        if (data.msg) document.getElementById('statusMsg').innerText = data.msg;
        if (data.percent !== undefined) {
          document.getElementById('percentMsg').innerText = data.percent + '%';
          document.getElementById('progressFill').style.width = data.percent + '%';
        }
      });
      window.electronSplashAPI.onError((err) => {
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorText').innerText = err || 'Unable to start Ableton AI Music Coach.';
      });
    }
  </script>
</body>
</html>
